<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Иконка раздела «Часы»: циферблат с часовой и минутной стрелками.
       Контур рисуется currentColor, поэтому перекрашивается темой Fyne. -->
  <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <!-- часовые метки -->
  <rect x="11.35" y="3.4" width="1.3" height="2.1" rx="0.5" fill="currentColor"/>
  <rect x="11.35" y="18.5" width="1.3" height="2.1" rx="0.5" fill="currentColor"/>
  <rect x="3.4" y="11.35" width="2.1" height="1.3" rx="0.5" fill="currentColor"/>
  <rect x="18.5" y="11.35" width="2.1" height="1.3" rx="0.5" fill="currentColor"/>
  <!-- часовая стрелка (на 10) -->
  <line x1="12" y1="12" x2="8.6" y2="9.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  <!-- минутная стрелка (на 2) -->
  <line x1="12" y1="12" x2="15.6" y2="8.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- ось -->
  <circle cx="12" cy="12" r="1.15" fill="currentColor"/>
</svg>
